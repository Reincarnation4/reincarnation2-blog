<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="reincarnation.log 文章"><title>文章 · reincarnation.log</title><link rel="stylesheet" href="site.css"><link rel="stylesheet" href="assets/css/variables.css"><link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml"><link rel="canonical" href="https://reincarnation4.github.io/reincarnation2-blog/post.html"><meta property="og:site_name" content="reincarnation.log"><meta property="og:type" content="website"><meta property="og:title" content="reincarnation.log"><meta property="og:description" content="给生活留一块可以返回的地方。"><meta name="twitter:card" content="summary"><meta name="theme-color" content="#f4f1e9"></head><body><main id="app"></main><div class="lightbox" id="lightbox"><button aria-label="关闭图片预览">关闭</button><img alt="放大预览"></div><script type="module">import{$,sb,esc,date,reading,safeHTML,published,shell,footer,bindLightbox,plain,category}from'./site.js';const slug=new URLSearchParams(location.search).get('slug');const app=$('#app');const renderComments=(rows)=>rows?.length?rows.map(c=>`<article class="message" id="comment-${c.id}"><b>${esc(c.guest_name||'匿名')}</b><time>${date(c.created_at)}</time><p>${c.body_html||esc(c.body||'')}</p></article>`).join(''):'<div class="empty">还没有回应，成为第一个留言的人。</div>';try{const posts=await published(),p=posts.find(x=>x.slug===slug);if(!p){app.innerHTML=shell('文章')+'<section class="page-head"><div class="eyebrow">404 / missing note</div><h1>这篇文章不在这里。</h1><p>它可能还在草稿箱，或者链接已经改变。</p><a class="primary" href="index.html">返回文章列表</a></section>'+footer();}else{document.title=p.title+' · reincarnation.log';const idx=posts.findIndex(x=>x.id===p.id),prev=posts[idx+1],next=posts[idx-1],headings=[],html=safeHTML(p.content_html,p.content).replace(/<(h[2-3])([^>]*)>(.*?)<\/h[2-3]>/gi,(m,t,a,text)=>{const id='section-'+headings.length;headings.push({id,text:plain(text)});return `<${t} id="${id}"${a}>${text}</${t}>`}),toc=headings.length?`<nav class="toc" aria-label="文章目录"><b>文章目录</b>${headings.map(h=>`<a href="#${h.id}">${esc(h.text)}</a>`).join('')}</nav>`:'';let comments=[];try{const r=await sb.from('comments').select('id,guest_name,body,body_html,created_at').eq('post_id',p.id).eq('status','approved').order('created_at',{ascending:false}).limit(50);comments=r.data||[]}catch{};const related=posts.filter(x=>x.id!==p.id&&(category(x)===category(p)||x.cover_url)).slice(0,3);app.innerHTML=shell('文章')+`<article class="post"><a class="eyebrow" href="index.html#archive">← 返回文章列表</a><div class="meta" style="margin-top:24px"><span class="tag">${esc(category(p))}</span><span>${date(p.published_at||p.created_at)}</span><span>${p.updated_at&&p.updated_at!==p.created_at?'更新 '+date(p.updated_at):''}</span><span>${reading(p)} min read</span><span>${plain(p.content).length} 字</span><span>${comments.length} 条回应</span></div><h1>${esc(p.title)}</h1><p style="color:var(--muted);font-family:var(--serif);font-size:18px">${esc(p.excerpt||'')}</p>${p.cover_url?`<img class="post-cover" src="${esc(p.cover_url)}" alt="${esc(p.title)}">`:''}${toc}<div class="post-body">${html}</div><div class="next-prev"><a href="${prev?'post.html?slug='+encodeURIComponent(prev.slug):'archive.html'}"><small>上一篇</small>${esc(prev?.title||'回到归档')}</a><a href="${next?'post.html?slug='+encodeURIComponent(next.slug):'topics.html'}" style="text-align:right"><small>下一篇</small>${esc(next?.title||'浏览主题')}</a></div><section class="comments" id="comments"><h3>回应 · ${comments.length}</h3><div class="comment-list">${renderComments(comments)}</div><form class="comment-form" id="commentForm"><input name="guest_name" required maxlength="60" placeholder="你的名字"><input name="guest_email" type="email" maxlength="120" placeholder="邮箱（可选）"><textarea name="body" required maxlength="2000" placeholder="对这篇文章说点什么…"></textarea><button class="primary">发布回应</button><span id="commentFeedback" class="meta" aria-live="polite"></span></form></section>${related.length?`<section style="margin-top:45px"><h3 style="font:600 25px var(--serif)">继续读</h3><div class="list">${related.map(x=>`<a class="archive-link" href="post.html?slug=${encodeURIComponent(x.slug)}"><span>${esc(x.title)}</span><span>${date(x.published_at||x.created_at)}</span></a>`).join('')}</div></section>`:''}</article>`+footer();$('#commentForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);$('#commentFeedback').textContent='正在发布…';const r=await sb.from('comments').insert({post_id:p.id,guest_name:f.get('guest_name'),guest_email:f.get('guest_email')||null,body:f.get('body'),body_plain:f.get('body'),body_html:`<p>${esc(f.get('body'))}</p>`,status:'approved'});if(r.error)$('#commentFeedback').textContent=r.error.message;else{$('#commentFeedback').textContent='已发布。';e.target.reset();const q=await sb.from('comments').select('id,guest_name,body,body_html,created_at').eq('post_id',p.id).eq('status','approved').order('created_at',{ascending:false}).limit(50);document.querySelector('.comment-list').innerHTML=renderComments(q.data||[]);}};bindLightbox();}}catch(e){app.innerHTML=shell('文章')+'<section class="page-head"><h1>暂时无法读取。</h1><p>'+esc(e.message)+'</p></section>'+footer()}</script></body></html>
