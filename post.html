<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="reincarnation.log 文章"><title>文章 · reincarnation.log</title><link rel="stylesheet" href="site.css"></head><body><main id="app"></main><div class="lightbox" id="lightbox"><button aria-label="关闭图片预览">关闭</button><img alt="放大预览"></div><script type="module">import{$,esc,date,reading,safeHTML,published,shell,footer,bindLightbox,plain,category}from'./site.js';const slug=new URLSearchParams(location.search).get('slug');const app=$('#app');try{const posts=await published(),p=posts.find(x=>x.slug===slug);if(!p){app.innerHTML=shell('文章')+'<section class="page-head"><div class="eyebrow">404 / missing note</div><h1>这篇文章不在这里。</h1><p>它可能还在草稿箱，或者链接已经改变。</p><a class="primary" href="index.html">返回文章列表</a></section>'+footer();}else{document.title=p.title+' · reincarnation.log';const headings=[];const html=safeHTML(p.content_html,p.content).replace(/<(h[2-3])([^>]*)>/gi,(m,t,a)=>{const id='section-'+headings.length;headings.push({id,text:''});return `<${t} id="${id}"${a}>`}).replace(/<h[2-3] id="section-(\d+)"([^>]*)>(.*?)<\/h[2-3]>/gi,(m,n,a,text)=>{headings[Number(n)].text=plain(text);return m});const toc=headings.length?`<nav class="toc" aria-label="文章目录"><b>文章目录</b>${headings.map(h=>`<a href="#${h.id}">${esc(h.text)}</a>`).join('')}</nav>`:'';app.innerHTML=shell('文章')+`<article class="post"><a class="eyebrow" href="index.html#archive">← 返回文章列表</a><div class="meta" style="margin-top:24px"><span class="tag">${esc(category(p))}</span><span>${date(p.published_at||p.created_at)}</span><span>${reading(p)} min read</span><span>${plain(p.content).length} 字</span></div><h1>${esc(p.title)}</h1><p style="color:var(--muted);font-family:var(--serif);font-size:18px">${esc(p.excerpt||'')}</p>${p.cover_url?`<img class="post-cover" src="${esc(p.cover_url)}" alt="${esc(p.title)}">`:''}${toc}<div class="post-body">${html}</div><div style="border-top:1px solid var(--line);margin-top:45px;padding-top:22px"><a href="index.html#archive">继续浏览文章 →</a></div></article>`+footer();bindLightbox();}}catch(e){app.innerHTML=shell('文章')+'<section class="page-head"><h1>暂时无法读取。</h1><p>'+esc(e.message)+'</p></section>'+footer()}</script></body></html>
