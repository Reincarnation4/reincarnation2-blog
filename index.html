<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>reincarnation.log · online notes</title>
  <style>
    :root{--ink:#18211f;--muted:#68736f;--paper:#f4f1e9;--card:#fffdf8;--line:#d9d8ce;--accent:#c64f32;--green:#2d6a5c;--shadow:0 16px 50px #2b332b12}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 8% 0,#e5e9dd 0,transparent 28%),var(--paper);color:var(--ink);font:16px/1.7 Georgia,'Noto Serif SC',serif}button,input,textarea{font:inherit}button{cursor:pointer;border:0}.shell{max-width:1120px;margin:auto;padding:28px 22px 70px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:22px}.brand{font-size:24px;font-weight:bold;letter-spacing:-.04em}.brand small{color:var(--accent);font:12px ui-monospace,monospace;margin-left:8px}.status{color:var(--green);font:12px ui-monospace,monospace}.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:42px;padding:66px 0 52px;align-items:end}.kicker{color:var(--accent);font:12px ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase}.hero h1{font-size:clamp(42px,7vw,80px);line-height:1.02;letter-spacing:-.07em;margin:15px 0}.hero p{color:var(--muted);max-width:520px;font-size:18px}.note{background:var(--card);border:1px solid var(--line);padding:24px;box-shadow:var(--shadow);transform:rotate(1deg)}.note strong{display:block;font-size:12px;text-transform:uppercase;color:var(--accent);margin-bottom:12px}.note code{font:13px ui-monospace,monospace;word-break:break-all;color:#53635d}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:20px}.toolbar input,.field input,.field textarea{width:100%;border:1px solid var(--line);background:#fffdf9;border-radius:5px;padding:11px 13px;outline:none}.toolbar input:focus,.field input:focus,.field textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px #2d6a5c15}.toolbar input{max-width:350px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.post{background:var(--card);border:1px solid var(--line);padding:23px;min-height:245px;display:flex;flex-direction:column;transition:.2s}.post:hover{transform:translateY(-4px);box-shadow:var(--shadow)}.meta{display:flex;justify-content:space-between;color:var(--muted);font:12px ui-monospace,monospace}.post h2{font-size:25px;line-height:1.18;letter-spacing:-.04em;margin:30px 0 12px}.post p{color:var(--muted);margin:0}.read{margin-top:auto;padding-top:18px;color:var(--accent);font-size:14px}.layout{display:grid;grid-template-columns:1.2fr .8fr;gap:24px;margin-top:42px}.panel{background:var(--card);border:1px solid var(--line);padding:25px}.panel h2{margin:0 0 18px;font-size:25px;letter-spacing:-.04em}.field{margin:12px 0}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}.field textarea{min-height:105px;resize:vertical}.primary{background:var(--ink);color:#fff;padding:11px 16px;border-radius:4px}.primary:hover{background:var(--accent)}.ghost{background:transparent;color:var(--muted);padding:7px 0}.feedback{min-height:25px;font-size:13px;color:var(--green)}.guest{border-top:1px solid var(--line);padding:13px 0}.guest b{font-size:14px}.guest span{display:block;color:var(--muted);font-size:14px}.empty{grid-column:1/-1;padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line)}.detail{display:none;background:var(--card);border:1px solid var(--line);padding:35px;margin-bottom:22px}.detail h2{font-size:42px;line-height:1.1;margin:12px 0}.detail .body{white-space:pre-wrap;font-size:18px;max-width:760px}.hidden{display:none!important}@media(max-width:800px){.hero,.layout{grid-template-columns:1fr;gap:22px}.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;gap:12px;flex-direction:column}.hero{padding-top:42px}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="top"><div class="brand">reincarnation.log <small>ONLINE</small></div><div><a href="./admin.html" style="color:var(--muted);font:12px ui-monospace,monospace;margin-right:16px">admin ↗</a><span class="status" id="status">● connecting to supabase…</span></div></header>
    <section class="hero"><div><div class="kicker">personal notes / 2026</div><h1>把生活写成<br><em>可返回的记忆。</em></h1><p>一个轻量的公开博客。文章、评论和留言现在都直接读写 Supabase，不再依赖本地存储。</p></div><aside class="note"><strong>connection note</strong><code>rxjgnaldzryzkyoxgrle.supabase.co<br>postgres · realtime-ready<br>browser → REST → cloud</code></aside></section>
    <section id="detail" class="detail"><button class="ghost" id="back">← back to notes</button><div class="kicker" id="detailMeta"></div><h2 id="detailTitle"></h2><div class="body" id="detailBody"></div></section>
    <section><div class="toolbar"><input id="search" placeholder="搜索文章…" /><button class="ghost" id="refresh">↻ refresh</button></div><div id="posts" class="grid"><div class="empty">正在从 Supabase 读取文章…</div></div></section>
    <section class="layout"><div class="panel"><h2>写一篇新的</h2><form id="postForm"><div class="field"><label>标题</label><input name="title" required maxlength="120" placeholder="今天想记录什么？" /></div><div class="field"><label>正文</label><textarea name="content" required placeholder="把它写下来…"></textarea></div><div class="field"><label>摘要（可选）</label><input name="excerpt" maxlength="240" placeholder="一句话介绍这篇文章" /></div><button class="primary">发布到 Supabase</button><div class="feedback" id="postFeedback"></div></form></div><div class="panel"><h2>留言板</h2><div id="guestbook"><div class="feedback">正在读取留言…</div></div><form id="guestForm"><div class="field"><label>名字</label><input name="guest_name" required maxlength="60" placeholder="你的名字" /></div><div class="field"><label>留言</label><textarea name="body" required maxlength="1000" placeholder="留下一句话…"></textarea></div><button class="primary">写入留言</button><div class="feedback" id="guestFeedback"></div></form></div></section>
  </div>
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
    const supabase=createClient('https://rxjgnaldzryzkyoxgrle.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ4amduYWxkenJ5emt5b3hncmxlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNDYzNzUsImV4cCI6MjEwNTYyMjM3NX0.9YFteJnn1SH4byYmw_EvHWMT4fV8cedz6xmgHUXcJMs');
    const $=s=>document.querySelector(s); let posts=[];
    const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
    const slug=s=>s.toLowerCase().trim().replace(/[^\w\u4e00-\u9fff]+/g,'-').replace(/^-|-$/g,'')+'-'+Date.now().toString(36);
    async function loadPosts(){const {data,error}=await supabase.from('posts').select('*').order('published_at',{ascending:false});if(error)throw error;posts=data||[]; renderPosts(); $('#status').textContent='● supabase connected';}
    function renderPosts(){const q=$('#search').value.trim().toLowerCase();const list=posts.filter(p=>(p.title+p.excerpt+p.content).toLowerCase().includes(q));$('#posts').innerHTML=list.length?list.map(p=>`<article class="post">${p.cover_url?`<img src="${esc(p.cover_url)}" alt="" style="width:100%;height:130px;object-fit:cover;margin:-23px -23px 18px;width:calc(100% + 46px)">`:''}<div class="meta"><span>${esc(p.status==='published'?'published':'draft')}</span><span>${esc(p.read_time_minutes||3)} min read</span></div><h2>${esc(p.title)}</h2><p>${esc(p.excerpt||p.content.slice(0,100))}</p><button class="ghost read" data-id="${p.id}">read note →</button></article>`).join(''):'<div class="empty">还没有匹配的文章。写下第一篇吧。</div>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openPost(Number(b.dataset.id)));}
    function openPost(id){const p=posts.find(x=>x.id===id);if(!p)return;$('#detailMeta').textContent=(p.status||'published')+' / '+new Date(p.created_at).toLocaleDateString('zh-CN');$('#detailTitle').textContent=p.title;$('#detailBody').innerHTML=(p.cover_url?`<img src="${esc(p.cover_url)}" alt="" style="max-width:100%;max-height:420px;object-fit:cover;margin:8px 0 24px">`:'' )+`<div style="white-space:pre-wrap">${esc(p.content)}</div>`;$('#detail').style.display='block';scrollTo({top:0,behavior:'smooth'});}
    async function loadGuestbook(){const {data,error}=await supabase.from('guestbook_messages').select('id,guest_name,body,created_at').order('created_at',{ascending:false}).limit(8);if(error)throw error;$('#guestbook').innerHTML=data?.length?data.map(g=>`<div class="guest"><b>${esc(g.guest_name)}</b><span>${esc(g.body)}</span></div>`).join(''):'<div class="feedback">还没有留言，来写第一条。</div>';}
    $('#search').oninput=renderPosts;$('#refresh').onclick=()=>Promise.all([loadPosts(),loadGuestbook()]).catch(showError);$('#back').onclick=()=>$('#detail').style.display='none';
    $('#postForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),title=f.get('title'),content=f.get('content'),excerpt=f.get('excerpt')||content.slice(0,100);$('#postFeedback').textContent='正在写入…';const {error}=await supabase.from('posts').insert({title,slug:slug(title),content,excerpt,status:'published',featured:false,read_time_minutes:Math.max(1,Math.ceil(content.length/220)),published_at:new Date().toISOString()});if(error)$('#postFeedback').textContent='写入失败：'+error.message;else{e.target.reset();$('#postFeedback').textContent='已写入云端。';await loadPosts();}};
    $('#guestForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);$('#guestFeedback').textContent='正在写入…';const {error}=await supabase.from('guestbook_messages').insert({guest_name:f.get('guest_name'),body:f.get('body'),status:'approved'});if(error)$('#guestFeedback').textContent='写入失败：'+error.message;else{e.target.reset();$('#guestFeedback').textContent='留言已写入 Supabase。';await loadGuestbook();}};
    function showError(e){$('#status').textContent='● connection error';$('#posts').innerHTML='<div class="empty">读取失败：'+esc(e.message)+'</div>';}
    Promise.all([loadPosts(),loadGuestbook()]).catch(showError);
  </script>
</body></html>
