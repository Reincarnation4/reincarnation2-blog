<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="reincarnation.log 时间归档"><title>归档 · reincarnation.log</title><link rel="stylesheet" href="site.css"></head><body><main id="app"></main><script type="module">import{$,esc,date,shell,footer,published}from'./site.js';const app=$('#app');try{const posts=await published(),years={};posts.forEach(p=>{const d=new Date(p.published_at||p.created_at),y=d.getFullYear(),m=d.toLocaleDateString('zh-CN',{month:'long'});years[y]??={};years[y][m]??=[];years[y][m].push(p)});const html=Object.entries(years).sort((a,b)=>b[0]-a[0]).map(([y,months])=>`<section><h2 class="archive-year">${y}</h2>${Object.entries(months).map(([m,ps])=>`<div class="archive-month">${m} · ${ps.length} 篇</div>${ps.map(p=>`<a class="archive-link" href="post.html?slug=${encodeURIComponent(p.slug)}"><span>${esc(p.title)}</span><span>${date(p.published_at||p.created_at)}</span></a>`).join('')}`).join('')}</section>`).join('');app.innerHTML=shell('归档')+`<section class="page-head"><div class="eyebrow">archive / timeline</div><h1>按时间返回。</h1><p>旧文章不会消失，只是安静地等待下一次打开。</p></section><section class="content-grid"><div>${html||'<div class="empty">还没有已发布文章。</div>'}</div><aside class="side"><h2>归档说明</h2><p>目前按文章的发布时间组织，点击任意标题进入独立阅读页。</p><a href="topics.html">按主题浏览 →</a></aside></section>`+footer();}catch(e){app.innerHTML=shell('归档')+'<section class="page-head"><h1>归档暂时无法读取。</h1><p>'+esc(e.message)+'</p></section>'+footer()}</script></body></html>
