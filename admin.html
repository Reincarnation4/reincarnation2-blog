<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>reincarnation.log · rich admin</title>
<style>
:root{--ink:#18211f;--muted:#68736f;--paper:#f4f1e9;--card:#fffdf8;--line:#d9d8ce;--accent:#c64f32;--green:#2d6a5c;--soft:#ece9df;--radius:14px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 100% 0,#e5e6d8,transparent 30%),var(--paper);color:var(--ink);font:15px/1.65 Manrope,system-ui,sans-serif}.shell{max-width:1280px;margin:auto;padding:25px 28px 70px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:18px}.brand{font:700 22px Georgia,serif;letter-spacing:-.04em}.top a,.muted{color:var(--muted);font-size:13px}.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;margin-top:28px}.panel{background:color-mix(in srgb,var(--card) 92%,transparent);border:1px solid var(--line);padding:24px;border-radius:var(--radius);box-shadow:0 16px 40px #18211f0a}.panel h1,.panel h2{margin:0 0 18px;line-height:1.15}.panel h1{font:600 38px Georgia,serif}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.field{margin:14px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff;outline:0;font:inherit;color:var(--ink)}.field textarea{min-height:100px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus,.rich:focus{border-color:var(--green);box-shadow:0 0 0 4px #2d6a5c18}.primary,.danger,.ghost{border:0;border-radius:999px;padding:10px 15px;cursor:pointer;font:500 13px inherit}.primary{background:var(--ink);color:#fff}.primary:hover{background:var(--accent)}.danger{background:#f3ded8;color:#9c301d}.ghost{background:transparent;color:var(--muted);padding-left:0}.feedback{min-height:25px;color:var(--green);font-size:13px}.error{color:#a43725}.postitem{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:14px 4px;cursor:pointer;color:var(--ink)}.postitem:hover,.postitem.active{color:var(--accent)}.postitem small{display:block;color:var(--muted);font:11px ui-monospace,monospace}.preview{max-width:100%;max-height:200px;object-fit:cover;border:1px solid var(--line);display:none;margin-top:8px;border-radius:9px}.login{max-width:440px;margin:90px auto}.hidden{display:none!important}.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}.search{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:999px;background:#fff;margin-bottom:10px}.toolbar{display:flex;gap:5px;flex-wrap:wrap;padding:8px;border:1px solid var(--line);border-bottom:0;border-radius:9px 9px 0 0;background:var(--soft)}.tool{min-width:32px;height:30px;border:1px solid transparent;background:transparent;border-radius:6px;color:var(--ink);cursor:pointer;font-weight:600}.tool:hover,.tool.active{background:var(--card);border-color:var(--line);color:var(--accent)}.emoji-pop{display:none;gap:4px;flex-wrap:wrap;padding:8px;background:var(--card);border:1px solid var(--line);border-radius:8px;margin-top:5px}.emoji-pop.open{display:flex}.emoji-pop button{border:0;background:transparent;font-size:21px;padding:4px;cursor:pointer;border-radius:5px}.emoji-pop button:hover{background:var(--soft)}.rich{min-height:360px;border:1px solid var(--line);border-radius:0 0 9px 9px;background:#fff;padding:18px 20px;outline:0;font:17px/1.85 Georgia,'Noto Serif SC',serif}.rich:empty:before{content:attr(data-placeholder);color:#a0a7a1}.rich img{max-width:100%;height:auto;border-radius:10px}.rich blockquote{border-left:3px solid var(--accent);margin:15px 0;padding:8px 16px;color:var(--muted);background:#f8f3eb}.rich pre{background:#18211f;color:#f7f2e9;padding:15px;border-radius:8px;overflow:auto}.rich iframe,.rich video{max-width:100%;border:0;border-radius:9px;display:block;margin:12px 0}.rich a{color:var(--accent);text-decoration:underline}.media-note{color:var(--muted);font-size:12px;margin-top:6px}.image-preview{max-width:240px;max-height:150px;object-fit:cover;border:1px solid var(--line);display:none;margin-top:8px}.embed-card{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px;background:#faf8f2}.embed-card span{font-size:12px;color:var(--muted)}@media(max-width:800px){.shell{padding:18px 15px 50px}.layout{grid-template-columns:1fr}.login{margin:30px auto}.panel{padding:18px}.rich{min-height:280px}}
</style></head><body><div class="shell"><header class="top"><div class="brand">reincarnation.log / admin</div><a href="./">← 返回博客</a></header>
<section id="login" class="panel login"><h1>进入后台</h1><p class="muted">富文本文章与媒体编辑器 · Supabase Auth</p><form id="loginForm"><div class="field"><label>邮箱</label><input name="email" type="email" required value="reincarnation2@qq.com"></div><div class="field"><label>密码</label><input name="password" type="password" required></div><button class="primary">登录</button><div id="loginFeedback" class="feedback"></div></form></section>
<section id="app" class="layout hidden"><aside class="panel"><div class="actions"><h2 style="margin-right:auto">文章 <small id="count" class="muted"></small></h2><button id="newPost" class="primary">新建</button></div><input id="postSearch" class="search" placeholder="筛选文章…"><div id="list"></div><div id="user" class="muted" style="margin-top:20px"></div><button id="logout" class="ghost">退出登录</button></aside>
<main class="panel"><h1 id="editorHeading">编辑文章</h1><form id="editor"><input type="hidden" name="id"><div class="field"><label>标题</label><input name="title" required maxlength="120"></div><div class="field"><label>Slug</label><input name="slug" required maxlength="160"></div><div class="field"><label>摘要</label><input name="excerpt" maxlength="240"></div><div class="field"><label>正文编辑器</label><div class="toolbar" id="toolbar"><button type="button" class="tool" data-cmd="bold"><b>B</b></button><button type="button" class="tool" data-cmd="italic"><i>I</i></button><button type="button" class="tool" data-cmd="underline"><u>U</u></button><button type="button" class="tool" data-cmd="formatBlock" data-value="h2">H2</button><button type="button" class="tool" data-cmd="formatBlock" data-value="blockquote">❝</button><button type="button" class="tool" data-cmd="insertUnorderedList">☷</button><button type="button" class="tool" data-cmd="insertOrderedList">№</button><button type="button" class="tool" id="linkTool">↗ 链接</button><button type="button" class="tool" id="imageTool">▧ 图片</button><button type="button" class="tool" id="videoTool">▶ 视频</button><button type="button" class="tool" id="codeTool">&lt;/&gt;</button><button type="button" class="tool" id="emojiTool">😊 Emoji</button><input id="imageFile" type="file" accept="image/*" hidden></div><div class="emoji-pop" id="emojiPop">😀 😃 😄 😁 😆 😅 😂 🙂 🙃 😉 😊 😎 🤔 😮 😴 🥳 🤍 ❤️ 🔥 ✨ 🌱 🎨 💡 🚀 👀 🙌</div><div id="rich" class="rich" contenteditable="true" data-placeholder="从这里开始写。可以插入图片、视频、链接、引用、代码和 Emoji…"></div><p class="media-note">图片会上传到 Supabase Storage；视频支持 MP4/WebM 链接和 YouTube/Vimeo 链接。</p></div><div class="field"><label>状态</label><select name="status"><option value="published">published · 已发布</option><option value="draft">draft · 草稿</option><option value="archived">archived · 归档</option></select></div><div class="field"><label>封面图 URL</label><input name="cover_url" placeholder="上传后会自动填入，也可以粘贴外链"><input id="coverFile" type="file" accept="image/*" style="margin-top:8px"><img id="preview" class="preview"></div><div class="field"><label class="check"><input name="featured" type="checkbox"> 设为精选</label></div><div class="actions"><button class="primary">保存到 Supabase</button><button type="button" id="delete" class="danger">删除文章</button><div id="saveFeedback" class="feedback"></div></div></form></main></section></div>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';
const sb=createClient('https://rxjgnaldzryzkyoxgrle.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ4amduYWxkenJ5emt5b3hncmxlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNDYzNzUsImV4cCI6MjEwNTYyMjM3NX0.9YFteJnn1SH4byYmw_EvHWMT4fV8cedz6xmgHUXcJMs');
const $=s=>document.querySelector(s);let posts=[],current=null;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const clean=html=>{const doc=new DOMParser().parseFromString(html,'text/html'),allow=['P','BR','STRONG','EM','U','S','A','UL','OL','LI','BLOCKQUOTE','PRE','CODE','H2','H3','IMG','FIGURE','FIGCAPTION','VIDEO','SOURCE','IFRAME','HR','DIV','SPAN'];doc.body.querySelectorAll('*').forEach(el=>{if(!allow.includes(el.tagName)){el.replaceWith(...el.childNodes);return} [...el.attributes].forEach(a=>{if(!['href','src','alt','title','target','controls','class','width','height'].includes(a.name))el.removeAttribute(a.name);if(['href','src'].includes(a.name)&&!/^https?:\/\//i.test(a.value))el.removeAttribute(a.name)});if(el.tagName==='IFRAME'&&!/^https:\/\/(www\.)?(youtube\.com|youtube-nocookie\.com|player\.vimeo\.com)\//.test(el.src))el.remove()});return doc.body.innerHTML};
function feedback(id,msg,error=false){$(id).textContent=msg;$(id).className='feedback'+(error?' error':'')}
function fill(p){current=p;const f=$('#editor');f.elements.id.value=p?.id||'';f.title.value=p?.title||'';f.slug.value=p?.slug||'';f.excerpt.value=p?.excerpt||'';$('#rich').innerHTML=clean(p?.content_html||`<p>${esc(p?.content||'')}</p>`);f.status.value=p?.status||'published';f.cover_url.value=p?.cover_url||'';f.featured.checked=!!p?.featured;$('#editorHeading').textContent=p?'编辑文章':'新建文章';$('#delete').classList.toggle('hidden',!p);$('#preview').style.display=p?.cover_url?'block':'none';if(p)$('#preview').src=p.cover_url||'';document.querySelectorAll('.postitem').forEach(x=>x.classList.toggle('active',Number(x.dataset.id)===p?.id));}
function renderList(){const q=$('#postSearch').value.toLowerCase();const visible=posts.filter(p=>(p.title+' '+p.slug).toLowerCase().includes(q));$('#count').textContent=`· ${posts.length}`;$('#list').innerHTML=visible.map(p=>`<button class="postitem" data-id="${p.id}">${esc(p.title)}<small>${esc(p.status)} · ${p.cover_url?'有封面':'无封面'}</small></button>`).join('')||'<p class="muted">没有匹配文章</p>';document.querySelectorAll('.postitem').forEach(b=>b.onclick=()=>fill(posts.find(p=>p.id===Number(b.dataset.id))));}
async function load(){const{data,error}=await sb.from('posts').select('*').order('published_at',{ascending:false});if(error)throw error;posts=data||[];renderList();if(!current&&posts[0])fill(posts[0]);}
async function boot(){const{data:{user}}=await sb.auth.getUser();if(!user)return;const{data:profile}=await sb.from('profiles').select('display_name,role').eq('id',user.id).limit(1).maybeSingle();if(profile?.role!=='admin'){feedback('#loginFeedback','这个账号不是 admin。',true);return}$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#user').textContent=user.email+' · admin';try{await load()}catch(e){feedback('#saveFeedback',e.message,true)}}
async function upload(file,folder){if(!file)return null;const path=`${folder}/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'-')}`;const up=await sb.storage.from('blog-media').upload(path,file,{upsert:true,contentType:file.type});if(up.error)throw up.error;return sb.storage.from('blog-media').getPublicUrl(path).data.publicUrl}
function insert(html){document.execCommand('insertHTML',false,html);$('#rich').focus()}
$('#loginForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);feedback('#loginFeedback','正在登录…');const{error}=await sb.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error)feedback('#loginFeedback',error.message,true);else boot()};
$('#postSearch').oninput=renderList;$('#newPost').onclick=()=>fill(null);$('#logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
$('#toolbar').onclick=e=>{const b=e.target.closest('[data-cmd]');if(!b)return;document.execCommand(b.dataset.cmd,false,b.dataset.value||null);$('#rich').focus()};
$('#linkTool').onclick=()=>{const url=prompt('输入链接 URL（https://…）');if(url&&/^https?:\/\//i.test(url))document.execCommand('createLink',false,url)};
$('#codeTool').onclick=()=>insert('<pre><code>在这里粘贴代码…</code></pre>');$('#videoTool').onclick=()=>{const url=prompt('输入 MP4/WebM、YouTube 或 Vimeo 链接');if(!url)return;const yt=url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]+)/);const vm=url.match(/vimeo\.com\/(\d+)/);if(yt)insert(`<iframe width="560" height="315" src="https://www.youtube-nocookie.com/embed/${yt[1]}" title="视频" allowfullscreen></iframe>`);else if(vm)insert(`<iframe width="560" height="315" src="https://player.vimeo.com/video/${vm[1]}" title="视频" allowfullscreen></iframe>`);else if(/^https?:\/\//i.test(url))insert(`<video controls src="${esc(url)}"></video>`)};
$('#imageTool').onclick=()=>$('#imageFile').click();$('#imageFile').onchange=async e=>{try{const url=await upload(e.target.files[0],'posts');if(url)insert(`<figure><img src="${url}" alt="文章图片"><figcaption>图片说明</figcaption></figure>`)}catch(err){feedback('#saveFeedback',err.message,true)}};$('#emojiTool').onclick=()=>$('#emojiPop').classList.toggle('open');$('#emojiPop').onclick=e=>{if(e.target.tagName==='BUTTON')insert(e.target.textContent)};$('#emojiPop').innerHTML=$('#emojiPop').textContent.split(' ').map(x=>`<button type="button">${x}</button>`).join('');
$('#coverFile').onchange=async e=>{try{const url=await upload(e.target.files[0],'posts');if(url){$('#editor').elements.cover_url.value=url;$('#preview').src=url;$('#preview').style.display='block'}}catch(err){feedback('#saveFeedback',err.message,true)}};
$('#editor').onsubmit=async e=>{e.preventDefault();const f=e.target;feedback('#saveFeedback','正在保存…');const html=clean($('#rich').innerHTML);const text=$('#rich').innerText.trim();const input={title:f.title.value,slug:f.slug.value,excerpt:f.excerpt.value,content:text,content_html:html,content_format:'html',cover_url:f.cover_url.value.trim()||null,status:f.status.value,featured:f.featured.checked,read_time_minutes:Math.max(1,Math.ceil(text.length/220)),published_at:f.status.value==='published'?(current?.published_at||new Date().toISOString()):null};const result=f.elements.id.value?await sb.from('posts').update(input).eq('id',f.elements.id.value):await sb.from('posts').insert(input);if(result.error)feedback('#saveFeedback',result.error.message,true);else{feedback('#saveFeedback','已保存到 Supabase。');current=null;await load()}};
$('#delete').onclick=async()=>{if(!current||!confirm('确定删除这篇文章吗？'))return;const{error}=await sb.from('posts').delete().eq('id',current.id);if(error)feedback('#saveFeedback',error.message,true);else{feedback('#saveFeedback','已删除。');current=null;await load()}};boot();
</script></body></html>
