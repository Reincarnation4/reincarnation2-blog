<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>reincarnation.log · admin</title><style>:root{--ink:#18211f;--muted:#68736f;--paper:#f4f1e9;--card:#fffdf8;--line:#d9d8ce;--accent:#c64f32;--green:#2d6a5c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 Georgia,'Noto Serif SC',serif}.shell{max-width:1180px;margin:auto;padding:28px 22px 70px}.top{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:18px}.brand{font-size:24px;font-weight:bold}.top a,.muted{color:var(--muted);font-size:13px}.layout{display:grid;grid-template-columns:310px 1fr;gap:24px;margin-top:30px}.panel{background:var(--card);border:1px solid var(--line);padding:24px}.panel h1,.panel h2{margin:0 0 20px;line-height:1.15}.panel h1{font-size:38px}.field{margin:13px 0}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:4px;padding:10px 12px;background:#fff;outline:0;font:inherit}.field textarea{min-height:300px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--green);box-shadow:0 0 0 3px #2d6a5c18}.primary,.danger,.ghost{border:0;border-radius:4px;padding:10px 14px;cursor:pointer;font:inherit}.primary{background:var(--ink);color:#fff}.primary:hover{background:var(--accent)}.danger{background:#f3ded8;color:#9c301d}.ghost{background:transparent;color:var(--muted);padding-left:0}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.feedback{min-height:26px;color:var(--green);font-size:13px}.error{color:#a43725}.postitem{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:14px 4px;cursor:pointer;color:var(--ink)}.postitem:hover,.postitem.active{color:var(--accent)}.postitem small{display:block;color:var(--muted);font:11px ui-monospace,monospace}.preview{max-width:240px;max-height:150px;object-fit:cover;border:1px solid var(--line);display:none;margin-top:8px}.login{max-width:440px;margin:90px auto}.hidden{display:none!important}.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}@media(max-width:760px){.layout{grid-template-columns:1fr}.login{margin:30px auto}}</style></head><body><div class="shell"><header class="top"><div class="brand">reincarnation.log / admin</div><a href="./">← 返回博客</a></header><section id="login" class="panel login"><h1>进入后台</h1><p class="muted">使用 Supabase Auth 管理员账号登录。</p><form id="loginForm"><div class="field"><label>邮箱</label><input name="email" type="email" required value="reincarnation2@qq.com"></div><div class="field"><label>密码</label><input name="password" type="password" required></div><button class="primary">登录</button><div id="loginFeedback" class="feedback"></div></form></section><section id="app" class="layout hidden"><aside class="panel"><div class="actions"><h2 style="margin-right:auto">文章</h2><button id="newPost" class="primary">新建</button></div><div id="list"></div><div id="user" class="muted" style="margin-top:20px"></div><button id="logout" class="ghost">退出登录</button></aside><main class="panel"><h1 id="editorHeading">编辑文章</h1><form id="editor"><input type="hidden" name="id"><div class="field"><label>标题</label><input name="title" required maxlength="120"></div><div class="field"><label>Slug</label><input name="slug" required maxlength="160"></div><div class="field"><label>摘要</label><input name="excerpt" maxlength="240"></div><div class="field"><label>正文</label><textarea name="content" required></textarea></div><div class="field"><label>状态</label><select name="status"><option value="published">published · 已发布</option><option value="draft">draft · 草稿</option><option value="archived">archived · 归档</option></select></div><div class="field"><label>封面图 URL</label><input name="cover_url" placeholder="上传后会自动填入，也可以粘贴外链"></div><div class="field"><label>替换封面图</label><input id="image" type="file" accept="image/*"><img id="preview" class="preview"></div><div class="field"><label class="check"><input name="featured" type="checkbox"> 设为精选</label></div><div class="actions"><button class="primary">保存到 Supabase</button><button type="button" id="delete" class="danger">删除文章</button><div id="saveFeedback" class="feedback"></div></div></form></main></section></div><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const sb=createClient('https://rxjgnaldzryzkyoxgrle.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ4amduYWxkenJ5emt5b3hncmxlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNDYzNzUsImV4cCI6MjEwNTYyMjM3NX0.9YFteJnn1SH4byYmw_EvHWMT4fV8cedz6xmgHUXcJMs');const $=s=>document.querySelector(s);let posts=[],current=null;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function feedback(id,msg,error=false){$(id).textContent=msg;$(id).className='feedback'+(error?' error':'')}function fill(p){current=p;const f=$('#editor');f.elements.id.value=p?.id||'';f.title.value=p?.title||'';f.slug.value=p?.slug||'';f.excerpt.value=p?.excerpt||'';f.content.value=p?.content||'';f.status.value=p?.status||'published';f.cover_url.value=p?.cover_url||'';f.featured.checked=!!p?.featured;$('#editorHeading').textContent=p?'编辑文章':'新建文章';$('#delete').classList.toggle('hidden',!p);$('#preview').style.display=p?.cover_url?'block':'none';if(p)$('#preview').src=p.cover_url||'';document.querySelectorAll('.postitem').forEach(x=>x.classList.toggle('active',Number(x.dataset.id)===p?.id));}async function load(){const{data,error}=await sb.from('posts').select('*').order('published_at',{ascending:false});if(error)throw error;posts=data||[];$('#list').innerHTML=posts.map(p=>`<button class="postitem" data-id="${p.id}">${esc(p.title)}<small>${esc(p.status)} · ${p.cover_url?'有封面':'无封面'}</small></button>`).join('')||'<p class="muted">暂无文章</p>';document.querySelectorAll('.postitem').forEach(b=>b.onclick=()=>fill(posts.find(p=>p.id===Number(b.dataset.id))));if(!current&&posts[0])fill(posts[0]);}async function boot(){const{data:{user}}=await sb.auth.getUser();if(!user)return;const{data:profile}=await sb.from('profiles').select('display_name,role').eq('id',user.id).limit(1).maybeSingle();if(profile?.role!=='admin'){feedback('#loginFeedback','这个账号不是 admin。',true);return}$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#user').textContent=user.email+' · admin';try{await load()}catch(e){feedback('#saveFeedback',e.message,true)}}$('#loginForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);feedback('#loginFeedback','正在登录…');const{error}=await sb.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error)feedback('#loginFeedback',error.message,true);else boot()};$('#newPost').onclick=()=>fill(null);$('#logout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('#image').onchange=e=>{const file=e.target.files[0];if(file){$('#preview').src=URL.createObjectURL(file);$('#preview').style.display='block'}};$('#editor').onsubmit=async e=>{e.preventDefault();const f=e.target;feedback('#saveFeedback','正在保存…');let cover=f.cover_url.value.trim();const file=$('#image').files[0];if(file){const path=`covers/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'-')}`;const up=await sb.storage.from('blog-media').upload(path,file,{upsert:true,contentType:file.type});if(up.error){feedback('#saveFeedback',up.error.message,true);return}cover=sb.storage.from('blog-media').getPublicUrl(path).data.publicUrl;f.cover_url.value=cover}const input={title:f.title.value,slug:f.slug.value,excerpt:f.excerpt.value,content:f.content.value,cover_url:cover||null,status:f.status.value,featured:f.featured.checked,read_time_minutes:Math.max(1,Math.ceil(f.content.value.length/220)),published_at:f.status.value==='published'?(current?.published_at||new Date().toISOString()):null};let result;if(f.elements.id.value)result=await sb.from('posts').update(input).eq('id',f.elements.id.value);else result=await sb.from('posts').insert(input);if(result.error)feedback('#saveFeedback',result.error.message,true);else{feedback('#saveFeedback','已保存到 Supabase。');current=null;await load();}};$('#delete').onclick=async()=>{if(!current||!confirm('确定删除这篇文章吗？'))return;const{error}=await sb.from('posts').delete().eq('id',current.id);if(error)feedback('#saveFeedback',error.message,true);else{feedback('#saveFeedback','已删除。');current=null;await load();}};boot();</script></body></html>
