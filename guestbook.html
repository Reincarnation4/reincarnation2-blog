<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="reincarnation.log 留言板"><title>留言板 · reincarnation.log</title><link rel="stylesheet" href="site.css"></head><body><main id="app"></main><script type="module">import{$,sb,esc,date,shell,footer}from'./site.js';const app=$('#app');app.innerHTML=shell('关于')+`<section class="page-head"><div class="eyebrow">guestbook / open notes</div><h1>留一句话。</h1><p>它会和其他访客的留言一起，留在这个小小的线上角落。</p></section><section class="content-grid"><div><div id="messages" class="list"><div class="empty">正在读取留言…</div></div></div><aside><form class="guest-form" id="form"><h2 style="font:600 28px var(--serif);margin-top:0">写给这里</h2><input name="guest_name" required maxlength="60" placeholder="你的名字"><input name="guest_email" type="email" maxlength="120" placeholder="邮箱（可选）"><textarea name="body" required maxlength="1000" placeholder="今天想说什么？"></textarea><button class="primary">写入留言板</button><p id="feedback" class="muted" aria-live="polite"></p></form></aside></section>`+footer();async function load(){const{data,error}=await sb.from('guestbook_messages').select('guest_name,body,created_at').eq('status','approved').order('created_at',{ascending:false}).limit(50);if(error)throw error;$('#messages').innerHTML=data?.length?data.map(m=>`<article class="message"><b>${esc(m.guest_name)}</b><time>${date(m.created_at)}</time><p>${esc(m.body)}</p></article>`).join(''):'<div class="empty">还没有留言，写下第一句吧。</div>'}$('#form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);$('#feedback').textContent='正在写入…';const{error}=await sb.from('guestbook_messages').insert({guest_name:f.get('guest_name'),guest_email:f.get('guest_email')||null,body:f.get('body'),status:'approved'});if(error)$('#feedback').textContent=error.message;else{e.target.reset();$('#feedback').textContent='已写入云端。';load()}};load().catch(e=>$('#messages').innerHTML='<div class="empty">留言暂时无法读取：'+esc(e.message)+'</div>');</script></body></html>
