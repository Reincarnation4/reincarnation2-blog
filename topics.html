<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="reincarnation.log 主题索引"><title>主题 · reincarnation.log</title><link rel="stylesheet" href="site.css"></head><body><main id="app"></main><script type="module">import{$,esc,shell,footer,published,card}from'./site.js';const app=$('#app');try{const posts=await published(),map={};posts.forEach(p=>{const k=p.category?.slug||p.category?.name||'essay';if(!map[k])map[k]={name:p.category?.name||p.category||'随笔',posts:[]};map[k].posts.push(p)});const cards=Object.values(map).map(x=>`<article class="panel" style="background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px"><div class="eyebrow">${x.posts.length} notes</div><h2 style="font:600 30px var(--serif);margin:8px 0">${esc(x.name)}</h2><div class="meta">公开主题 · ${x.posts.length} 篇</div><a class="primary" style="display:inline-block;margin-top:16px" href="#${encodeURIComponent(x.name)}">浏览主题 →</a></article>`).join('');app.innerHTML=shell('主题')+`<section class="page-head"><div class="eyebrow">topics / index</div><h1>按主题翻阅。</h1><p>把相似的念头放在一起，方便再次遇见。</p></section><section style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;padding:38px 0 90px">${cards}</section><section class="content-grid" style="padding-top:0"><div>${Object.values(map).map(x=>`<section id="${encodeURIComponent(x.name)}" style="margin-bottom:55px"><div class="section-head"><h2 style="font:600 32px var(--serif)">${esc(x.name)}</h2><span class="meta">${x.posts.length} 篇</span></div><div class="list">${x.posts.map(card).join('')}</div></section>`).join('')}</div><aside class="side"><h2>探索</h2><p>主题页面会持续从 Supabase 读取已发布文章。</p><a href="archive.html">时间归档 →</a><a href="guestbook.html">留言板 →</a></aside></section>`+footer();}catch(e){app.innerHTML=shell('主题')+'<section class="page-head"><h1>主题暂时无法读取。</h1><p>'+esc(e.message)+'</p></section>'+footer()}</script></body></html>
